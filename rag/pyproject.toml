[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rops-rag"
version = "0.1.0"
description = "MVP analizy i dopasowania pomysłów społecznych"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3", "pydantic>=2.0,<3", "python-dotenv>=1.0,<2", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rops_rag*"]
