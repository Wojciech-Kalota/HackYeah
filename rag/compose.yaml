services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rops
      POSTGRES_USER: rops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rops -d rops"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rops:${POSTGRES_PASSWORD}@postgres:5432/rops
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  rops_postgres:
